1. 触发条件：当有代码 push 到 master 或 main 分支时，自动启动流水线

on:
push:
branches: [ "master", "main" ]

2. 任务清单 (Jobs)

jobs:
test:
# 租用一台最新版的 Ubuntu Linux 云服务器
runs-on: ubuntu-latest

# 3. 具体的执行步骤
steps:
# 步骤 A：把你的代码克隆到这台云服务器上
- name: Checkout Code
  uses: actions/checkout@v3

# 步骤 B：在服务器上安装 Python 3.10
- name: Set up Python
  uses: actions/setup-python@v4
  with:
    python-version: '3.10'

# 步骤 C：安装自动化
