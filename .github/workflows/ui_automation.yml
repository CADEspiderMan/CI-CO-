name: UI Automation CI

1. 触发条件：当你 push 代码到 main 分支时触发

on:push:branches: [ "main" ]

2. 任务清单 (Jobs)

jobs:test:# 租用一台最新版的 Ubuntu Linux 云服务器
runs-on: ubuntu-latest

# 3. 具体的执行步骤 (Steps)
steps:
  # 步骤 A：把你的代码克隆到这台云服务器上
  - name: Checkout Code
    uses: actions/checkout@v3

  # 步骤 B：在服务器上安装 Python 3.10
  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  # 步骤 C：安装 Python 依赖库 (Pytest, Playwright 等)
  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      pip install pytest pytest-playwright requests jsonpath pandas

  # 步骤 D：安装 Playwright 需要的浏览器内核 (只装 chromium 节省时间)
  - name: Install Playwright Browsers
    run: playwright install chromium

  # 步骤 E：运行你的测试脚本！
  - name: Run Pytest
    run: pytest test_sauce_checkout.py -vs

